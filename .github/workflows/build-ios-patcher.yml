name: Build iOS lab binaries (arm64e)

on:
  workflow_dispatch:
    inputs:
      ios_min_version:
        description: "Minimum iOS deployment target (e.g. 15.0)"
        required: false
        default: "15.0"
      lab_label:
        description: "Artifact label (e.g. ios26.5-23F77-i12-1)"
        required: false
        default: "ios26.5-23F77-i12-1"
      build_target:
        description: "gestaltpatcher | iokit_spoof | product_set | both | all"
        required: false
        default: "all"
      mach_arch:
        description: "arm64e (mad/iokit) | arm64 (gestalt tool only)"
        required: false
        default: "arm64e"
  push:
    branches: [main, master]
    paths:
      - "poc.m"
      - "iokit_spoof.m"
      - "product_set.m"
      - ".github/workflows/build-ios-patcher.yml"
      - "scripts/**"
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile gestaltpatcher (optional)
        if: github.event.inputs.build_target != 'iokit_spoof' && github.event.inputs.build_target != 'product_set'
        env:
          IOS_MIN: ${{ github.event.inputs.ios_min_version || '15.0' }}
          MACH_ARCH: ${{ github.event.inputs.mach_arch || 'arm64e' }}
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang \
            -target "${MACH_ARCH}-apple-ios${IOS_MIN}" \
            -arch "${MACH_ARCH}" \
            -isysroot "$SDK" \
            -mios-version-min="${IOS_MIN}" \
            -fobjc-arc \
            -framework Foundation \
            -o gestaltpatcher \
            poc.m
          file gestaltpatcher
          ls -la gestaltpatcher

      - name: Compile libiokit_spoof.dylib (arm64e)
        if: github.event.inputs.build_target != 'gestaltpatcher' && github.event.inputs.build_target != 'product_set'
        env:
          IOS_MIN: ${{ github.event.inputs.ios_min_version || '15.0' }}
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # mobileactivationd is arm64e (PAC) on A13+ — dylib must match
          xcrun clang \
            -target "arm64e-apple-ios${IOS_MIN}" \
            -arch arm64e \
            -isysroot "$SDK" \
            -mios-version-min="${IOS_MIN}" \
            -dynamiclib \
            -fobjc-arc \
            -O2 \
            -install_name "@rpath/libiokit_spoof.dylib" \
            -framework Foundation \
            -framework IOKit \
            -framework CoreFoundation \
            -ldl \
            -o libiokit_spoof.dylib \
            iokit_spoof.m
          file libiokit_spoof.dylib
          ls -la libiokit_spoof.dylib

      - name: Compile product_set (IOKit :product tool)
        if: github.event.inputs.build_target != 'gestaltpatcher' && github.event.inputs.build_target != 'iokit_spoof'
        env:
          IOS_MIN: ${{ github.event.inputs.ios_min_version || '15.0' }}
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang \
            -target "arm64e-apple-ios${IOS_MIN}" \
            -arch arm64e \
            -isysroot "$SDK" \
            -mios-version-min="${IOS_MIN}" \
            -fobjc-arc \
            -O2 \
            -framework Foundation \
            -framework IOKit \
            -framework CoreFoundation \
            -ldl \
            -o product_set \
            product_set.m
          file product_set
          ls -la product_set

      - name: Smoke test Mach-O
        run: |
          if [ -f gestaltpatcher ]; then file gestaltpatcher | grep -E 'Mach-O|arm64'; fi
          if [ -f libiokit_spoof.dylib ]; then file libiokit_spoof.dylib | grep -E 'Mach-O|arm64e|dynamically'; fi
          if [ -f product_set ]; then file product_set | grep -E 'Mach-O|arm64e|executable'; fi

      - name: Upload gestaltpatcher
        if: github.event.inputs.build_target != 'iokit_spoof' && github.event.inputs.build_target != 'product_set'
        uses: actions/upload-artifact@v4
        with:
          name: gestaltpatcher-${{ github.event.inputs.lab_label || 'ios26.5-23F77-i12-1' }}
          path: gestaltpatcher
          if-no-files-found: error
          retention-days: 90

      - name: Upload libiokit_spoof.dylib
        if: github.event.inputs.build_target != 'gestaltpatcher' && github.event.inputs.build_target != 'product_set'
        uses: actions/upload-artifact@v4
        with:
          name: libiokit_spoof-${{ github.event.inputs.lab_label || 'ios26.5-23F77-i12-1' }}-arm64e
          path: libiokit_spoof.dylib
          if-no-files-found: error
          retention-days: 90

      - name: Upload product_set
        if: github.event.inputs.build_target != 'gestaltpatcher' && github.event.inputs.build_target != 'iokit_spoof'
        uses: actions/upload-artifact@v4
        with:
          name: product_set-${{ github.event.inputs.lab_label || 'ios26.5-23F77-i12-1' }}-arm64e
          path: product_set
          if-no-files-found: error
          retention-days: 90

      - name: Write build info
        env:
          IOS_MIN: ${{ github.event.inputs.ios_min_version || '15.0' }}
          MACH_ARCH: ${{ github.event.inputs.mach_arch || 'arm64e' }}
        run: |
          {
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ios_min=${IOS_MIN}"
            echo "mach_arch=${MACH_ARCH}"
            echo "iokit_arch=arm64e"
            echo "lab_label=${{ github.event.inputs.lab_label || 'ios26.5-23F77-i12-1' }}"
            echo "build_target=${{ github.event.inputs.build_target || 'both' }}"
            echo "xcode=$(xcodebuild -version | head -1)"
            echo "sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            [ -f gestaltpatcher ] && echo "gestaltpatcher_sha256=$(shasum -a 256 gestaltpatcher | awk '{print $1}')"
            [ -f libiokit_spoof.dylib ] && echo "iokit_spoof_sha256=$(shasum -a 256 libiokit_spoof.dylib | awk '{print $1}')"
            [ -f product_set ] && echo "product_set_sha256=$(shasum -a 256 product_set | awk '{print $1}')"
          } > build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.event.inputs.lab_label || 'ios26.5-23F77-i12-1' }}
          path: build-info.txt
          retention-days: 90
