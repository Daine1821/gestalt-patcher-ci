name: Build gestaltpatcher (iOS arm64)

on:
  workflow_dispatch:
    inputs:
      ios_min_version:
        description: "Minimum iOS deployment target (e.g. 15.0)"
        required: false
        default: "15.0"
      lab_label:
        description: "Optional label for artifact (e.g. ios26.1-23B85)"
        required: false
        default: "ios26.1-23B85-iPhone12-5"
  push:
    branches: [main, master]
    paths:
      - "poc.m"
      - ".github/workflows/build-ios-patcher.yml"
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile gestaltpatcher (arm64 iOS)
        env:
          IOS_MIN: ${{ github.event.inputs.ios_min_version || '15.0' }}
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Using SDK: $SDK"
          echo "IOS_MIN=$IOS_MIN"
          xcrun clang \
            -target "arm64-apple-ios${IOS_MIN}" \
            -isysroot "$SDK" \
            -mios-version-min="${IOS_MIN}" \
            -fobjc-arc \
            -framework Foundation \
            -o gestaltpatcher \
            poc.m
          file gestaltpatcher
          ls -la gestaltpatcher

      - name: Smoke test (host cannot run iOS binary)
        run: |
          file gestaltpatcher | grep -E 'Mach-O|arm64'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestaltpatcher-${{ github.event.inputs.lab_label || 'arm64' }}
          path: gestaltpatcher
          if-no-files-found: error
          retention-days: 90

      - name: Write build info
        run: |
          {
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ios_min=${{ github.event.inputs.ios_min_version || '15.0' }}"
            echo "lab_label=${{ github.event.inputs.lab_label || 'ios26.1-23B85-iPhone12-5' }}"
            echo "xcode=$(xcodebuild -version | head -1)"
            echo "sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "sha256=$(shasum -a 256 gestaltpatcher | awk '{print $1}')"
          } > build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ github.event.inputs.lab_label || 'arm64' }}
          path: build-info.txt
          retention-days: 90
